modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Joshua Vucelich"
description='''Keeps Create Aeronautics vehicles, which are Sable sub-levels, from clipping through moving Create contraptions and from being deleted in the void. Not published to Modrinth or CurseForge.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="required"
versionRange="${sable_mod_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="${create_mod_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aeronautics"
type="optional"
versionRange="${aeronautics_mod_version_range}"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"
