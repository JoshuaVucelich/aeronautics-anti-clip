plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.ryanhcode.dev/releases' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
}

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation project(':sim')
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: 'foundry.veil'
        exclude group: 'com.simibubi.create'
    }
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${companion_version}"
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        exclude group: 'foundry.veil'
    }
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}"
}

tasks.named('jar', Jar).configure {
    from(project(':sim').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Vendor': 'Joshua Vucelich',
                'Specification-Version': project.version,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Joshua Vucelich',
                'Built-On-Minecraft': minecraft_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version           : minecraft_version,
            minecraft_version_range     : minecraft_version_range,
            neo_version                 : neo_version,
            neo_version_range           : neo_version_range,
            loader_version_range        : loader_version_range,
            mod_id                      : mod_id,
            mod_name                    : mod_name,
            mod_license                 : mod_license,
            mod_version                 : mod_version,
            sable_mod_version_range     : sable_mod_version_range,
            create_mod_version_range    : create_mod_version_range,
            aeronautics_mod_version_range: aeronautics_mod_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.register('assertNoPublicPublishing') {
    doLast {
        def banned = rootProject.allprojects.collectMany { proj ->
            proj.tasks.names.findAll { name ->
                def lower = name.toLowerCase()
                lower.contains('modrinth') || lower.contains('curseforge')
            }.collect { "${proj.path}:${it}" }
        }
        if (!banned.isEmpty()) {
            throw new GradleException("Refusing Modrinth or CurseForge publishing tasks: ${banned}")
        }
    }
}

tasks.named('build') {
    dependsOn 'assertNoPublicPublishing'
}
